# This target uses the common Cortex-A9 Linux MACHINE, in its own build directory.
EDF_DVRMC = "1"
IMAGE_INSTALL:append:pn-edf-linux-disk-image = " dvrmc-firmware fpga-manager-script"
IMAGE_INSTALL:append:pn-edf-linux-disk-image = " dmotor-semantic-tests dmotor-inspect dmotor-encoder"
# The fabric is configured by Linux, never by FSBL.
BIF_BITSTREAM_ATTR = ""

# Opt in after inhibited commissioning review; inspection remains the baseline.
EDF_DMOTOR_ACCESS ?= "inspection"
IMAGE_INSTALL:append:pn-edf-linux-disk-image = " ${@'dmotor-runtime kernel-module-dmotor-access' if d.getVar('EDF_DMOTOR_ACCESS') == 'production' else ''}"
