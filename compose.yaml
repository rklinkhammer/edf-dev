name: edf-dev-next
x-common: &common
  build: .
  image: edf-dev-next:26.06.1
  platform: linux/amd64
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  cap_add: [CHOWN, FOWNER, SETUID, SETGID, KILL]
  environment: &identity
    HOST_UID: ${HOST_UID:?Use ./edf}
    HOST_GID: ${HOST_GID:?Use ./edf}
    HOST_GROUPS: ${HOST_GROUPS:?Use ./edf}
services:
  hashserv:
    <<: *common
    restart: unless-stopped
    working_dir: /hashserv
    command: [/opt/edf/sources/poky/bitbake/bin/bitbake-hashserv, --bind, 'unix:///hashserv/hashserv.sock', --database, /hashserv/hashserv.db]
    volumes:
      - hashserv:/hashserv
    healthcheck:
      test: [CMD, /usr/local/bin/container-entrypoint, python3, -c, "import sys; sys.path.insert(0, '/opt/edf/sources/poky/bitbake/lib'); import hashserv; c=hashserv.create_client('unix:///hashserv/hashserv.sock'); c.get_stats(); c.close()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
  shell:
    <<: *common
    working_dir: /project
    cpus: ${EDF_CPUS:-4}
    mem_limit: ${EDF_MEMORY:-12g}
    environment:
      <<: *identity
      EDF_TARGET: ${EDF_TARGET:-zc702}
    depends_on:
      hashserv: {condition: service_healthy}
    volumes:
      - .:/project:ro
      - ${EDF_BUILD_ROOT:-build-state}:/home/amd-edf/edf
      - type: bind
        source: ${EDF_DOWNLOADS:-./downloads}
        target: /home/amd-edf/edf/downloads
        bind: {create_host_path: false}
      - type: bind
        source: ${EDF_SSTATE:-./sstate-cache}
        target: /home/amd-edf/edf/sstate-cache
        bind: {create_host_path: false}
      - ./scripts:/opt/edf-scripts:ro
      - ./config:/opt/edf-config:ro
      - ./hardware:/hardware:ro
      - type: bind
        source: ${EDF_ARTIFACTS:-./artifacts}
        target: /artifacts
        bind: {create_host_path: false}
      - hashserv:/hashserv:ro
volumes:
  build-state:
  hashserv:
